<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <title>MiniDeck 稽核測試</title>
  <style>
    body { margin: 24px; background: #101218; color: #f4f4f4; font: 16px/1.5 monospace; }
    iframe { position: fixed; left: -10000px; width: 1920px; height: 1080px; border: 0; }
    pre { padding: 16px; overflow: auto; border: 1px solid #444; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>MiniDeck 稽核 fixture</h1>
  <p id="status">執行中⋯</p>
  <pre id="result"></pre>
  <pre id="iteration-result"></pre>
  <iframe title="違規簡報" src="fixtures/bad-deck.html"></iframe>
  <script src="../public/app.js"></script>
  <script>
    document.querySelector("iframe").addEventListener("load", (event) => {
      const doc = event.currentTarget.contentDocument;
      const before = MD.audit.run(doc);
      const types = new Set([...before.fails, ...before.warns].map((item) => item.type));
      const fix = MD.audit.fixMechanical(doc);
      const after = MD.audit.run(doc);
      const fontFailsAfter = after.fails.filter((item) => item.type === "font-min");
      const pass =
        ["font-min", "density", "numbers"].every((type) => types.has(type)) &&
        before.fails.some((item) => item.type === "font-min") &&
        fontFailsAfter.length === 0 &&
        fix.changed > 0;
      const evidence = {
        pass,
        detectedTypes: [...types],
        before,
        mechanical: fix,
        after,
        fontFailsBefore: before.fails.filter((item) => item.type === "font-min").length,
        fontFailsAfter: fontFailsAfter.length,
      };
      globalThis.auditEvidence = evidence;
      document.body.dataset.result = pass ? "pass" : "fail";
      document.querySelector("#status").textContent = pass ? "PASS" : "FAIL";
      document.querySelector("#result").textContent = JSON.stringify(evidence, null, 2);
      console.log("AUDIT_FIXTURE_BEFORE", JSON.stringify({
        fails: before.fails.length,
        warns: before.warns.length,
        types: [...types],
        fontFails: evidence.fontFailsBefore,
      }));
      console.log("AUDIT_FIXTURE_AFTER", JSON.stringify({
        fails: after.fails.length,
        warns: after.warns.length,
        fontFails: evidence.fontFailsAfter,
        changed: fix.changed,
      }));
      if (!pass) console.error("AUDIT_FIXTURE_FAIL", JSON.stringify(evidence));

      const frame = event.currentTarget;
      frame.addEventListener("load", async () => {
        const iterateDoc = frame.contentDocument;
        iterateDoc.querySelectorAll("section.slide p")[1].textContent = "一般密度文字。";
        iterateDoc.querySelectorAll("section.slide p")[2].textContent = "一般指標文字。";
        const iterateBefore = MD.audit.run(iterateDoc);
        let mechanical;
        const iteration = await MD.iteration.run({
          maxRounds: 1,
          step: async () => {
            mechanical = MD.audit.fixMechanical(iterateDoc);
            return { version: 1, report: MD.audit.run(iterateDoc) };
          },
          rollback: async (version) => ({ version }),
        });
        const iterateAfter = iteration.rounds[0].report;
        const iterationPass =
          iterateBefore.fails.length > 0 &&
          iterateAfter.fails.length === 0 &&
          mechanical.changed > 0 &&
          iteration.rounds[0].score === MD.iteration.score(iterateAfter);
        globalThis.iterationEvidence = {
          pass: iterationPass,
          failsBefore: iterateBefore.fails.length,
          failsBeforeScore: iterateAfter.fails.length,
          changed: mechanical.changed,
          score: iteration.rounds[0].score,
        };
        document.querySelector("#iteration-result").textContent =
          JSON.stringify(globalThis.iterationEvidence, null, 2);
        document.body.dataset.iterationResult = iterationPass ? "pass" : "fail";
        document.querySelector("#status").textContent = pass && iterationPass ? "PASS" : "FAIL";
        console.log(
          `TASK_7_5_ITERATE_MECHFIX_${iterationPass ? "PASS" : "FAIL"}`,
          `fails_before=${iterateBefore.fails.length}`,
          `fails_before_score=${iterateAfter.fails.length}`,
          `changed=${mechanical.changed}`,
          `score=${iteration.rounds[0].score}`,
        );
        if (!iterationPass) {
          console.error("TASK_7_5_ITERATE_MECHFIX_FAIL", JSON.stringify(globalThis.iterationEvidence));
        }
      }, { once: true });
      frame.src = "fixtures/bad-deck.html?iterate";
    }, { once: true });
  </script>
</body>
</html>
