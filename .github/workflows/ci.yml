name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix workers/presentation-studio-mcp
      - run: npm run check
      - name: Native V2 MCP with isolated local D1/R2 and no outbound transport
        run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - name: Native UI with isolated local Worker/D1/R2 and mocked provider transport
        run: npm run test:browser
