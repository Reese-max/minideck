name: Presentation Studio MCP

on:
  pull_request:
    paths:
      - "workers/presentation-studio-mcp/**"
      - ".github/workflows/presentation-studio-mcp.yml"
  push:
    branches: [main]
    paths:
      - "workers/presentation-studio-mcp/**"
      - ".github/workflows/presentation-studio-mcp.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/presentation-studio-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/presentation-studio-mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run
