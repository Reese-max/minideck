name: Deploy Presentation Studio Runner

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy a polling-disabled preview or production runner"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      confirm_production:
        description: "Required when target is production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/presentation-studio-runner/package-lock.json
      - run: cd workers/presentation-studio-runner && npm ci
      - run: cd workers/presentation-studio-runner && npx --no-install wrangler types
      - run: cd workers/presentation-studio-runner && npm run check
      - run: cd workers/presentation-studio-runner && npx --no-install wrangler deploy --dry-run
      - name: Dry-run the preview named environment config
        run: cd workers/presentation-studio-runner && npx --no-install wrangler deploy --dry-run --env preview --containers-rollout=none
      - name: Dry-run the production named environment config
        run: cd workers/presentation-studio-runner && npx --no-install wrangler deploy --dry-run --env production --containers-rollout=none

  deploy-preview:
    needs: check
    if: inputs.target == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/presentation-studio-runner/package-lock.json
      - run: cd workers/presentation-studio-runner && npm ci
      - name: Refresh Cloudflare token
        id: cf_token
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
        run: |
          set -eu
          response=$(curl -sS -X POST "https://dash.cloudflare.com/oauth2/token" \
            -d "grant_type=refresh_token&refresh_token=${CF_REFRESH_TOKEN}&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")
          token=$(echo "$response" | jq -r '.access_token')
          test -n "$token" && test "$token" != "null"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy polling-disabled preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf_token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESENTATION_RUNNER_TOKEN: ${{ secrets.PRESENTATION_RUNNER_TOKEN }}
          CF_AI_ROUTER_API_KEY: ${{ secrets.CF_AI_ROUTER_API_KEY }}
        run: |
          set -eu
          test -n "$PRESENTATION_RUNNER_TOKEN"
          cd workers/presentation-studio-runner
          printf '%s' "$PRESENTATION_RUNNER_TOKEN" | npx --no-install wrangler secret put PRESENTATION_RUNNER_TOKEN --env preview
          if [ -n "${CF_AI_ROUTER_API_KEY:-}" ]; then
            printf '%s' "$CF_AI_ROUTER_API_KEY" | npx --no-install wrangler secret put CF_AI_ROUTER_API_KEY --env preview
          fi
          npx --no-install wrangler deploy --env preview

  deploy-production:
    needs: check
    if: inputs.target == 'production' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/presentation-studio-runner/package-lock.json
      - run: cd workers/presentation-studio-runner && npm ci
      - name: Refresh Cloudflare token
        id: cf_token
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
        run: |
          set -eu
          response=$(curl -sS -X POST "https://dash.cloudflare.com/oauth2/token" \
            -d "grant_type=refresh_token&refresh_token=${CF_REFRESH_TOKEN}&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")
          token=$(echo "$response" | jq -r '.access_token')
          test -n "$token" && test "$token" != "null"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy production container runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf_token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESENTATION_RUNNER_TOKEN: ${{ secrets.PRESENTATION_RUNNER_TOKEN }}
          CF_AI_ROUTER_API_KEY: ${{ secrets.CF_AI_ROUTER_API_KEY }}
        run: |
          set -eu
          test -n "$PRESENTATION_RUNNER_TOKEN"
          cd workers/presentation-studio-runner
          printf '%s' "$PRESENTATION_RUNNER_TOKEN" | npx --no-install wrangler secret put PRESENTATION_RUNNER_TOKEN --env production
          if [ -n "${CF_AI_ROUTER_API_KEY:-}" ]; then
            printf '%s' "$CF_AI_ROUTER_API_KEY" | npx --no-install wrangler secret put CF_AI_ROUTER_API_KEY --env production
          fi
          npx --no-install wrangler deploy --env production
